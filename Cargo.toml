[workspace]
resolver = "2"
members = [
    "crates/ymir-core",
    "crates/ymir-viz",
]
 
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
authors = ["Olivier BRUNEAU"]
 
# Pin shared dependencies at workspace level for version consistency.
# Crate Cargo.toml files reference these with `dep.workspace = true`.
[workspace.dependencies]
ymir-core = { path = "crates/ymir-core" }
rayon = "1.10"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
blake3 = "1.8"
criterion = { version = "0.5", features = ["html_reports"] }
image = { version = "0.25", default-features = false, features = ["png"] }
bevy_egui = "0.39"
crossbeam-channel = "0.5"
tracing = "0.1"
noise = "0.9"
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_asset",
    "bevy_state",
    "bevy_winit",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_ui",
    "bevy_text",
    "bevy_input_focus",
    "bevy_window",
    "bevy_log",
    "bevy_picking",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "default_font",
    "x11",
    "wayland",
    "picking",
    "mouse",
    "keyboard",
] }

# Step 8.5b D4 — whole-program optimisation for release builds.
# `lto = "fat"` enables cross-crate inlining and dead-code elimination;
# `codegen-units = 1` forces the whole workspace through a single LLVM
# unit so every inlining opportunity is visible. Compilation time
# penalty is ~20–60 s on cold release builds. `target-cpu=native` and
# PGO are intentionally excluded (portability + ceremony for marginal
# gain). Debug/test profiles inherit cargo defaults (unchanged).
[profile.release]
lto = "fat"
codegen-units = 1