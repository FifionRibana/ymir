# Ymir — geology rules, v0 (Finding 151, with Finding 152's `modulate`). The author edits this file; Ymir reads it.
#
# A resource's chance at a cell (0–100) is the MAX of its rules whose conditions all hold. Placers then travel
# downstream along the rivers from the resource's own zones. Ymir exports RELATIVE FAVOURABILITIES (0–100), never
# deposits nor probabilities: « Favorabilité dans Ymir, rareté dans Living Landz ».
#
# `modulate = "structural"` multiplies a rule's favourability by g(d) = g_min + (1 − g_min)·min(d / d_ref, 1), d the
# structural density (fracturing near plate contacts, sutures and past collisions): vein deposits form DISTRICTS.
#
# Every chance below is a PROXY / DECISION to tune by eye. Each `source` is a real deposit context cited from
# memory, TO CHECK:
#   [Robb] L. Robb 2005, Introduction to Ore-Forming Processes
#   [Evans] A.M. Evans 1993, Ore Geology and Industrial Minerals
#   [C&S] D.P. Cox & D.A. Singer 1986, Mineral Deposit Models, USGS Bulletin 1693
#   [Clifford] T.N. Clifford 1966, EPSL 1 (diamonds on Archean cratons)
#
# Rock classes: craton, belt, basaltic_volcanic, arc_volcanic, rift_fill, loose_deposits, evaporites, basement.

format = "ymir-geology-rules"
version = "0.2.0"
notes = "v0 rules (Finding 151) with the structural modulation of the vein rules (Finding 152)"

# g_min: DECISION (a belt without faults keeps a fifth of its favourability).
# d_ref: MEASURED on the témoin (Finding 152): the p90 of d over the land cells of the belts and the arc zone.
[modulation.structural]
d_ref = 0.994
g_min = 0.2

# ─────────────────────────────────────────────────────────────── 1. iron
[[resource]]
id = "iron"
name_fr = "Fer"
color = "#B5562F"

[[resource.rule]]
rock = ["craton"]
chance = 40
source = "banded iron formations of Precambrian cratons [Robb]"

[[resource.rule]]
belt = "fossil"
chance = 20
source = "skarn and ironstone in old orogens [Evans]"

[[resource.rule]]
wetland = true
temp_max_c = 15
slope_max = 0.01
chance = 30
source = "bog iron in cool wetlands and peatlands [Evans]"

# ─────────────────────────────────────────────────────────────── 2. gold
[[resource]]
id = "gold"
name_fr = "Or"
color = "#E6C229"

[[resource.rule]]
rock = ["belt"]
chance = 35
modulate = "structural"
source = "orogenic lode gold in metamorphic belts [Robb]"

[[resource.rule]]
volcano_setting = "arc"
volcano_within_km = 10
chance = 30
modulate = "structural"
source = "epithermal gold in volcanic arcs [C&S]"

[[resource.rule]]
rock = ["craton"]
chance = 10
source = "greenstone-belt gold in old cratons [Robb] (Ymir cannot tell greenstone from granite: low)"

[resource.placer]
source_min_chance = 20
river_min_area_km2 = 5.0
start_chance = 30
decay_per_km = 1.0
max_slope = 0.01
source = "placer gold in alluvium downstream of a source [Evans]"

